# Runs the lineup check on a schedule, publishes the results page to GitHub Pages,
# and sends a phone alert (ntfy) when a recommendation changes.
#
# GitHub doesn't guarantee schedule timing: in Nov 2026 runs started 4-8 hours late.
# So each check has earlier backups; a late run still lands before it's needed.
# Extra runs are free on a public repo and alerts only fire when something changes.
#
# Times are UTC. During standard time (Nov-Mar) Pacific = UTC-8; in Sep-Oct each lands an hour later.

name: Lineup check

on:
  schedule:
    # Week rollover and report card: Tue 12:07 PM, Tue 7:07 PM, Wed 7:07 AM PT
    - cron: "7 20 * * 2"
    - cron: "7 3 * * 3"
    - cron: "7 15 * * 3"
    # Before Thursday night kickoff (5:15 PM PT): Thu 6:07 AM, 10:07 AM, 2:37 PM PT
    - cron: "7 14 * * 4"
    - cron: "7 18 * * 4"
    - cron: "37 22 * * 4"
    # Saturday injury designations: Sat 11:07 AM, 7:07 PM PT
    - cron: "7 19 * * 6"
    - cron: "7 3 * * 0"
    # Sunday before 10:00 AM PT kickoff: 1:10 AM, 4:10 AM, 6:40 AM, 8:40 AM PT.
    # Only a run that starts after 8:30 AM PT sees the early-game inactives.
    - cron: "10 9 * * 0"
    - cron: "10 12 * * 0"
    - cron: "40 14 * * 0"
    - cron: "40 16 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lineup-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Lineup check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: >
          python -m sitstart
          --username "${{ vars.SLEEPER_USERNAME || 'thwangbo' }}"
          --out data --html site/index.html --trades site/trades.html --notify

      - name: Save snapshot history
        run: |
          git config user.name "lineup-bot"
          git config user.email "lineup-bot@users.noreply.github.com"
          git add data
          git commit -m "Lineup check $(date -u +%Y-%m-%dT%H:%MZ)" || echo "No changes"
          git push

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
