name: KTC probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Inspect KTC page
        run: |
          python - <<'PY'
          import re, urllib.request
          url = "https://keeptradecut.com/dynasty-rankings?page=0&filters=QB|WR|RB|TE|RDP&format=2"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (sitstart; personal dynasty helper)"})
          try:
              r = urllib.request.urlopen(req, timeout=60); html = r.read().decode("utf-8", "replace"); print("status", r.status)
          except Exception as e:
              print("FETCH ERROR", repr(e)); raise SystemExit(0)
          print("length", len(html))
          print("title", re.findall(r"<title>(.*?)</title>", html, re.S)[:1])
          for m in re.finditer(r"<script([^>]*)>", html):
              print("SCRIPT", m.group(1)[:160], "| next:", html[m.end():m.end()+120].replace("\n", " "))
          for kw in ["playersArray", "ktc-players", "superflexValues", "playerName", "oneQBValues", "__NEXT_DATA__", "Ja'Marr Chase", "Josh Allen"]:
              i = html.find(kw); print("KW", kw, html.count(kw), (html[max(0,i-200):i+300].replace("\n"," ") if i >= 0 else ""))
          PY
