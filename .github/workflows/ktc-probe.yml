name: KTC probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Inspect KTC page
        run: |
          python - <<'PY'
          import re, json, urllib.request, http.cookiejar
          cj = http.cookiejar.CookieJar()
          op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          H = {"User-Agent": "Mozilla/5.0 (sitstart; personal dynasty helper)"}
          def get(u, extra=None):
              r = op.open(urllib.request.Request(u, headers={**H, **(extra or {})}), timeout=60)
              return r.status, dict(r.headers), r.read().decode("utf-8", "replace")
          st, hd, html = get("https://keeptradecut.com/dynasty-rankings?page=0&filters=QB|WR|RB|TE|RDP&format=2")
          pv = re.search(r"playersVersion = '([^']+)'", html).group(1)
          src = re.search(r'src="(/early/dataCache\.js[^"]*)"', html).group(1)
          _, _, js = get("https://keeptradecut.com" + src)
          for c in ("KTC_DATA_CACHE_SCHEMA_REV", "KTC_PLAYERS_VERSION_HEADER"):
              m = re.search(c + r"\s*=\s*([^;]+);", js); print("CONST", c, m.group(1) if m else None)
          sr = re.search(r"KTC_DATA_CACHE_SCHEMA_REV\s*=\s*['\"]?([^'\";]+)", js)
          sr = sr.group(1) if sr else "1"
          print("COOKIES", [c.name for c in cj])
          url = f"https://keeptradecut.com/dynasty-rankings/player-pool?v={pv}&sr={sr}"
          try:
              st, hd, body = get(url, {"Referer": "https://keeptradecut.com/dynasty-rankings"})
              print("POOL", st, hd.get("Content-Type"), len(body), body[:300])
              data = json.loads(body)
              rows = data if isinstance(data, list) else data.get("players") or data
              print("TYPE", type(data).__name__, (list(data.keys())[:10] if isinstance(data, dict) else len(data)))
              r0 = rows[0] if isinstance(rows, list) else None
              print("KEYS", list(r0.keys())[:40] if r0 else None)
              print("SF", json.dumps((r0 or {}).get("superflexValues"))[:400])
              print("N", len(rows), "picks", sum(1 for r in rows if r.get("position") == "RDP"),
                    "chase", [ (r["playerName"], r["superflexValues"]["value"]) for r in rows if "Chase" in r.get("playerName","")][:3])
          except Exception as e:
              print("POOLERR", repr(e))
          PY
