name: KTC probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Inspect KTC page
        run: |
          python - <<'PY'
          import re, urllib.request
          H = {"User-Agent": "Mozilla/5.0 (sitstart; personal dynasty helper)"}
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=60).read().decode("utf-8", "replace")
          html = get("https://keeptradecut.com/dynasty-rankings?page=0&filters=QB|WR|RB|TE|RDP&format=2")
          src = re.search(r'src="(/early/dataCache\.js[^"]*)"', html).group(1)
          print("PV", re.search(r"playersVersion = '([^']+)'", html).group(1))
          js = get("https://keeptradecut.com" + src)
          print("JSLEN", len(js))
          for kw in ["ktcFetchPlayerPool", "fetch(", "/api", ".json", "dynasty", "playersVersion", "indexedDB", "localStorage"]:
              for m in list(re.finditer(re.escape(kw), js))[:4]:
                  print("KW", kw, "|", js[max(0, m.start()-250):m.start()+350].replace("\n", " "))
          PY
