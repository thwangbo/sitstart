# One-off data collection for building the trade finder. Safe to delete.
name: Probe

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: lineup-check
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        run: |
          mkdir -p probe
          curl -sS -m 60 "https://api.fantasycalc.com/values/current?isDynasty=true&numQbs=2&numTeams=12&ppr=0.5" -o probe/fantasycalc_dynasty.json
          curl -sS -m 60 "https://api.fantasycalc.com/values/current?isDynasty=false&numQbs=2&numTeams=12&ppr=0.5" -o probe/fantasycalc_redraft.json
          python - <<'PY'
          import json, urllib.request
          get = lambda u: json.loads(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "sitstart"}), timeout=60).read() or "null")
          B = "https://api.sleeper.app/v1"
          user = get(f"{B}/user/thwangbo")
          leagues = get(f"{B}/user/{user['user_id']}/leagues/nfl/2026")
          lg = next(l for l in leagues if "SUPER_FLEX" in (l.get("roster_positions") or []))
          lid = lg["league_id"]
          out = {"league": {k: lg.get(k) for k in ("league_id", "name", "season", "total_rosters", "draft_id", "previous_league_id")},
                 "settings": lg.get("settings"),
                 "traded_picks": get(f"{B}/league/{lid}/traded_picks"),
                 "drafts": get(f"{B}/league/{lid}/drafts"),
                 "rosters": get(f"{B}/league/{lid}/rosters"),
                 "users": [{k: u.get(k) for k in ("user_id", "display_name", "metadata")} for u in get(f"{B}/league/{lid}/users")],
                 "transactions": {wk: [t for t in (get(f"{B}/league/{lid}/transactions/{wk}") or []) if t.get("type") == "trade"] for wk in range(1, 11)}}
          prev = lg.get("previous_league_id")
          if prev and prev != "0":
              out["previous_traded_picks"] = get(f"{B}/league/{prev}/traded_picks")
          json.dump(out, open("probe/sleeper_league.json", "w"), indent=1)
          print("ok", len(out["traded_picks"]), sum(len(v) for v in out["transactions"].values()))
          PY
          ls -la probe
      - name: Save
        run: |
          git config user.name "lineup-bot"
          git config user.email "lineup-bot@users.noreply.github.com"
          git add probe
          git commit -m "Probe data" || echo "No changes"
          git pull --rebase
          git push
