# One-off data collection. Safe to delete.
name: Probe

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: lineup-check
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        run: |
          mkdir -p probe
          curl -sS -m 60 -A "Mozilla/5.0 (sitstart personal use)" "https://keeptradecut.com/dynasty-rankings?page=0&filters=QB|WR|RB|TE|RDP&format=2" -o probe/ktc.html
          ls -la probe
          python - <<'PY'
          import json, re
          html = open("probe/ktc.html", encoding="utf-8", errors="replace").read()
          out = {"bytes": len(html)}
          for key in ("playersArray", "superflexValues", "oneQBValues", "playerName", "RDP"):
              i = html.find(key)
              out[key] = {"count": html.count(key), "first": i, "context": html[max(0, i - 300): i + 600] if i >= 0 else None}
          out["scripts_with_values"] = [m.start() for m in re.finditer(r"<script[^>]*>", html)][:50]
          json.dump(out, open("probe/ktc_find.json", "w"), indent=1)
          i = html.find("superflexValues")
          if i >= 0:
              s0 = html.rfind("<script", 0, i); e0 = html.find("</script>", i)
              open("probe/ktc_script.txt", "w").write(html[s0:e0][:400000])
          PY
          rm -f probe/ktc.html
      - name: Save
        run: |
          git config user.name "lineup-bot"
          git config user.email "lineup-bot@users.noreply.github.com"
          git add probe
          git commit -m "Probe KTC" || echo "No changes"
          git pull --rebase
          git push
