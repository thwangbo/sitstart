# One-off data collection. Safe to delete.
name: Probe

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: lineup-check
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        run: |
          mkdir -p probe
          curl -sS -m 60 -A "Mozilla/5.0 (sitstart personal use)" "https://keeptradecut.com/dynasty-rankings?page=0&filters=QB|WR|RB|TE|RDP&format=2" -o probe/ktc.html
          ls -la probe
          python - <<'PY'
          import json, re
          html = open("probe/ktc.html", encoding="utf-8", errors="replace").read()
          m = re.search(r"var\s+playersArray\s*=\s*(\[.*?\]);", html, re.S)
          print("found array:", bool(m), "html bytes", len(html))
          if m:
              arr = json.loads(m.group(1))
              json.dump(arr, open("probe/ktc_players.json", "w"))
              print(len(arr)); print(json.dumps(arr[0], indent=1)[:2500])
              picks = [p for p in arr if p.get("position") in ("RDP", "PICK")]
              print("picks", len(picks), [p.get("playerName") for p in picks][:40])
          else:
              open("probe/ktc_head.txt", "w").write(html[:20000])
          PY
          rm -f probe/ktc.html
      - name: Save
        run: |
          git config user.name "lineup-bot"
          git config user.email "lineup-bot@users.noreply.github.com"
          git add probe
          git commit -m "Probe KTC" || echo "No changes"
          git pull --rebase
          git push
